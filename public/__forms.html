<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form registration</title>
  </head>
  <body>
    <form name="quote-request" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="quote-request" />
      <input name="service" />
      <input name="property-type" />
      <input name="frequency" />
      <input name="bedrooms" />
      <input name="bathrooms" />
      <input name="postcode" />
      <input name="preferred-date" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" />
      <textarea name="message"></textarea>
      <input name="consent" />
      <input name="bot-field" />
    </form>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" />
      <input name="subject" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
